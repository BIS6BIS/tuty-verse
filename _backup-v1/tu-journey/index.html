<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Tu’s Journey — a fan game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="console" aria-label="Handheld console">
  <div class="grip left">
    <button class="mini-btn" id="btnMinus" aria-label="Switch light or dark" title="Light / dark">−</button>
    <svg class="deco" viewBox="0 0 46 30" aria-hidden="true"><path d="M23 15C15 3 3 5 4 15c-1 10 11 12 19 0z" fill="#e0709d"/><path d="M23 15C31 3 43 5 42 15c1 10-11 12-19 0z" fill="#e0709d"/><circle cx="23" cy="15" r="4.5" fill="#f497bb"/></svg>
    <button class="stick" aria-hidden="true" tabindex="-1"></button>
    <div class="dpad">
      <button class="u" data-dir="-1" aria-label="Previous stage">▲</button>
      <button class="l" data-dir="-1" aria-label="Previous stage">◀</button>
      <button class="r" data-dir="1" aria-label="Next stage">▶</button>
      <button class="d" data-dir="1" aria-label="Next stage">▼</button>
    </div>
  </div>

  <div class="bezel">
    <section class="screen" id="screen">
      <header class="hud">
        <div class="who"><div class="avatar" id="avatar"></div><div><b>Tu’s Journey</b><span id="rank"></span></div></div>
        <div class="stats">
          <div class="pill" title="Gems"><i>💎</i><span id="gems">0</span></div>
          <div class="pill" title="Star coins"><i>⭐</i><span id="coins">0</span></div>
          <div class="pill prog" title="Memories collected"><i>♡</i><span id="progress">0/8</span></div>
          
          <button class="icon-btn" id="mailBtn" aria-label="Tu’s Birthday Mailbox" title="Birthday mailbox">💌</button>
          <button class="icon-btn" id="sndBtn" aria-label="Sound on" title="Sound">🔊</button>
          <button class="icon-btn" id="setBtn" aria-label="Settings" aria-expanded="false" title="Settings">⚙️</button>
        </div>
      </header>
      <div class="settings" id="settings" hidden>
        <h4>Settings</h4>
        <div class="set-row">Screen<div class="seg" id="themeSeg"><button data-t="auto">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div></div>
        <div class="set-row">Sound<div class="seg" id="soundSeg"><button data-s="1">On</button><button data-s="0">Off</button></div></div>
        <button class="ghost" id="resetBtn">Reset collected memories</button>
      </div>

      <div class="map-wrap" id="mapWrap">
        <div class="map" id="map"><svg class="terrain" id="terrain" aria-hidden="true"></svg><div class="token" id="token"></div></div>
      </div>

      <div class="preview">
        <div class="preview-text"><b id="pvTitle"></b><span id="pvSub"></span></div>
        <button class="cta" id="pvOpen">Open <span class="key">A</span></button>
      </div>

      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><article class="card" id="card"></article></div>
      

      <div class="mail" id="mail" role="dialog" aria-modal="true" aria-label="Tu’s Birthday Mailbox">
        <div class="phone">
          <div class="ph-top"><button class="back" id="mailBack" aria-label="Close mailbox">‹</button><div class="bd" style="--bc:#ffd257;width:38px;height:38px" id="mailAv"></div><div><b>Tu’s Birthday Mailbox</b><span id="mailCount"></span></div></div>
          <div class="ph-list" id="mailList"></div>
          <div class="ph-foot"><button class="fake" id="mailFake">Send your own birthday wish…</button><button class="send" id="mailSend" aria-label="Send a wish">➤</button></div>
        </div>
      </div>

      <div class="gwrap" id="gwrap" role="dialog" aria-modal="true"><div class="gcard" id="gcard"></div></div>

      <div class="start" id="start">
        <div id="floaties"></div>
        <div class="start-inner">
          <div class="hero-sun" id="heroSun"></div>
          <span class="eyebrow">🌻 A fan-made birthday gift</span>
          <h1>Happy Birthday, Tu!</h1>
          <p class="sub">Follow Tu Tontawan’s journey from dental school to leading lady, one stage at a time.</p>
          <div class="btns">
            <button class="btn-start" id="startBtn">✨ Press Start Journey ✨</button>
            <button class="mailbox-btn" id="wishesBtn"><svg viewBox="0 0 64 56" aria-hidden="true"><rect x="24" y="32" width="6" height="22" rx="2" fill="#c8935f"/><g class="env"><rect x="12" y="2" width="20" height="14" rx="2.5" fill="#fff" stroke="#e0709d" stroke-width="1.8"/><path d="M12.5 3.5l9.5 7 9.5-7" stroke="#e0709d" stroke-width="1.8" fill="none"/></g><rect x="4" y="14" width="46" height="22" rx="11" fill="#f5bfd4" stroke="#e0709d" stroke-width="2"/><rect x="4" y="14" width="22" height="22" rx="11" fill="#e0709d"/><path d="M15 22c-1.5-2.5-5-1.5-4.5 1 .4 1.8 4.5 4 4.5 4s4.1-2.2 4.5-4c.5-2.5-3-3.5-4.5-1z" fill="#fff"/><g class="flag"><rect x="51" y="12" width="3" height="18" rx="1.5" fill="#3a2340"/><rect x="54" y="12" width="9" height="7" rx="1.5" fill="#ff5c7f"/></g></svg><span>💌 Mailbox / Fan Wishes</span></button>
          </div>
          
        </div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </div>

  <div class="grip right">
    <button class="mini-btn" id="btnPlus" aria-label="Sound on or off" title="Sound">+</button>
    <div class="abxy">
      <button class="x" id="btnX" title="Previous photo">X</button>
      <button class="y" id="btnY" title="Next photo">Y</button>
      <button class="a" id="btnA" title="Open / collect">A</button>
      <button class="b" id="btnB" title="Close">B</button>
    </div>
    <button class="stick" aria-hidden="true" tabindex="-1"></button>
    <div class="row"><svg class="deco" viewBox="0 0 46 30" aria-hidden="true"><path d="M30 4a11 11 0 1 0 10 15 9 9 0 1 1-10-15z" fill="#a985e0"/><path d="M12 8l2 5 5 .5-4 3 1.3 5L12 19l-4.3 2.5L9 16.5l-4-3L10 13z" fill="#e9b14f"/></svg><button class="home-btn" id="btnHome" aria-label="Home">⌂</button></div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
